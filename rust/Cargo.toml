[package]
name = "agent-memory"
version = "0.1.0"
edition = "2021"
description = "Local-first, cognitively-inspired memory system for AI agents"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
reqwest = { version = "0.12", features = ["json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
thiserror = "2"
rand = "0.8"
toml = "0.8"
async-trait = "0.1"
